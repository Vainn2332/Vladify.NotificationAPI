name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build: 
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 

    - name: Setup JDK 17 
      uses: actions/setup-java@v4
      with:
        java-version: 17 
        distribution: 'zulu'

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0'

    - name: Restore Dependencies
      run: dotnet restore 

    - name: Install SonarCloud Scanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Start Analysis
      env:
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
      run:  
        dotnet sonarscanner begin
        /k:"Vainn2332_Vladify.NotificationAPI"
        /o:"vainn2332"
        /d:sonar.token="$SONAR_TOKEN"
        /d:sonar.host.url="https://sonarcloud.io"
        /d:sonar.cs.opencover.reportsPaths="**/TestResults/**/coverage.opencover.xml"

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test --no-build --configuration Release --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      env:
        MongoDbOptions__ConnectionString: ${{ secrets.MONGO_CONNECTION_STRING }}
        MongoDbOptions__DatabaseName: ${{secrets.MONGO_DB_NAME}}

        EmailNotificationOptions__ApplicationPassword: ${{ secrets.EMAIL_APP_PASSWORD }}
        EmailNotificationOptions__SenderEmail: ${{ secrets.EMAIL_SENDER_MAIL }}
        EmailNotificationOptions__SenderName: "no-reply@vladify.com"
        EmailNotificationOptions__Port: "222"
        EmailNotificationOptions__SMTPClientUrl: ${{ secrets.SMTP_URL}}
        
        RabbitMqOptions__ServerHost: "localhost"
        RabbitMqOptions__Username: ${{ secrets.RABBIT_USERNAME}}
        RabbitMqOptions__Password: ${{ secrets.RABBIT_PASSWORD }}
        
        Auth0Options__Domain: ${{ secrets.AUTH0_DOMAIN }}
        Auth0Options__Audience: ${{ secrets.AUTH0_AUDIENCE }}


    - name: End Analysis
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
    